<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تهنئة خاصة</title>
<style>
body {
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #fff5f7 0%, #ffe9ee 100%);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  text-align: center;
}
#main-content {
  background: white;
  padding: 40px 25px;
  border-radius: 30px;
  box-shadow: 0 10px 40px rgba(255, 71, 87, 0.12);
  border-top: 6px solid #ff4757;
  max-width: 420px;
  margin: 20px;
  animation: fadeIn 1.2s ease-out;
}
h1 {
  color: #ff4757;
  font-size: 26px;
  margin-bottom: 25px;
}
p {
  color: #444;
  font-size: 18px;
  line-height: 1.8;
  margin: 12px 0;
}
.special-line {
  color: #ff6b81;
  font-weight: bold;
  font-size: 20px;
  margin-top: 20px;
  border-top: 1px dashed #ffd1d1;
  padding-top: 15px;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div id="main-content">
  <h1>كل سنة وأنت طيب يا إسلام 🎂✨</h1>
  <p>بداية سنة جديدة ربنا يجعلها عوض ليك عن كل اللي عدا 🤍</p>
  <p>أتمنى لك أيام حلوة زيك تفرح قلبك ❤️</p>
  <p>وعقبال ١٠٠ سنة يارب 🎈 وأنت محقق اللي بتتمناه 🤲❤️</p>
  <p>ربنا يديم ضحكتك ع وشك ❤️</p>
  <p class="special-line">ومتضايقش ع الماتش 🔪</p>
</div>
</body>
</html>
